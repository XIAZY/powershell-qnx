## OpenSSL target for QNX Neutrino 6.5.0 on x86: clang's Linux i386 driver with
## QNX's predefines and the headers of the QNX rootfs in ROOTFS_DIR, the same
## compiler settings as the runtime's eng/native/qnx/toolchain.cmake. Only the
## static libraries are built (Configure no-shared; make build_libs), so
## nothing is linked.
my $rootfs = $ENV{ROOTFS_DIR} // die "ROOTFS_DIR must name a QNX 6.5.0 x86 rootfs";
my $gcc = "$rootfs/usr/lib/gcc/i486-pc-nto-qnx6.5.0/4.4.2";
my $clang_resource = `clang -print-resource-dir`;
chomp $clang_resource;

my %targets = (
    "qnx650-x86" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "clang",
        cflags           => join(" ",
            "--target=i386-pc-linux-gnu -O2 -Wall",
            "-march=i686 -msse2 -mfpmath=sse -mstack-alignment=4 -fno-omit-frame-pointer",
            "-femulated-tls -fno-use-init-array -fno-stack-protector -nostdinc",
            "-U__linux__ -U__linux -Ulinux -U__gnu_linux__ -Uunix -U__FLOAT128__ -U__SIZEOF_FLOAT128__",
            "-D__QNX__ -D__QNXNTO__ -D__unix__ -D__unix -D__ELF__ -D__X86__ -D__i386__ -D__LITTLEENDIAN__",
            "-isystem $clang_resource/include -isystem $gcc/include -isystem $rootfs/usr/include"),
        # The objects go into System.Security.Cryptography.Native.OpenSsl.so.
        cflags_pic       => "-fPIC",
        lib_cflags       => "-fPIC",
        lib_cppflags     => "-DL_ENDIAN",
        # QNX has no libpthread and no libdl: both are in libc. Sockets and
        # getaddrinfo are in libsocket.
        ex_libs          => "-lsocket",
        bn_ops           => "BN_LLONG",
        thread_scheme    => "pthreads",
        dso_scheme       => "dlfcn",
        asm_arch         => 'x86',
        perlasm_scheme   => "elf",
        shared_target    => "linux-shared",
    },
);
