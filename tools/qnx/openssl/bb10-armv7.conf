##
## OpenSSL target for QNX Neutrino on 32-bit ARMv7, as on BlackBerry 10:
## clang's Linux ARM EABI driver with QNX's predefines and the headers of the
## QNX rootfs in ROOTFS_DIR, the same compiler settings as the runtime's
## eng/native/qnx/toolchain.cmake for TARGET_BUILD_ARCH=arm. Only the static
## libraries are built (Configure no-shared), so nothing is
## linked.
##
## Build it with no-asm, and with "make build_generated libcrypto.a libssl.a"
## (build_libs also builds the apps' library, which needs <syslog.h>).
## OpenSSL's ARM assembly finds the CPU's features by executing ARMv8
## instructions and catching SIGILL (there is no getauxval on QNX), but QNX
## reports an undefined instruction in the coprocessor space as SIGFPE:
## measured on a BlackBerry 10 phone (MSM8974, Krait), every openssl command
## died with SIGFPE in _armv8_pmull_probe. With the probe skipped
## (OPENSSL_armcap=0x1, NEON) the assembly passed every check, at 170 MB/s for
## SHA-256 and 53 MB/s for AES-128-GCM against no-asm's 67 and 25; the phone's
## network is far slower than either. Should the speed ever matter, the way out
## is a QNX branch in crypto/armcap.c that reads the CPU features from the
## system page (as Mono's mono-hwcap-arm.c does), a patch to OpenSSL that would
## have to be carried.
my $rootfs = $ENV{ROOTFS_DIR} // die "ROOTFS_DIR must name a QNX ARMv7 rootfs";
my $clang_resource = `clang -print-resource-dir`;
chomp $clang_resource;

my %targets = (
    "bb10-armv7" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "clang",
        cflags           => join(" ",
            "--target=armv7-pc-linux-gnueabi -O2 -Wall",
            "-march=armv7-a -mfpu=vfpv3 -mfloat-abi=softfp -mno-unaligned-access -fno-omit-frame-pointer",
            "-femulated-tls -nostdinc",
            "-U__linux__ -U__linux -Ulinux -U__gnu_linux__ -Uunix -U__FLOAT128__ -U__SIZEOF_FLOAT128__",
            "-D__QNX__ -D__QNXNTO__ -D__unix__ -D__unix -D__ELF__ -D__ARM__ -D__LITTLEENDIAN__",
            "-isystem $clang_resource/include -isystem $rootfs/usr/include"),
        # The objects go into System.Security.Cryptography.Native.OpenSsl.so.
        cflags_pic       => "-fPIC",
        lib_cflags       => "-fPIC",
        # NO_SYSLOG: the BlackBerry 10 SDK has no <syslog.h> (libc has the
        # functions); OpenSSL's syslog BIO then does nothing, as on WASI.
        lib_cppflags     => "-DL_ENDIAN -DNO_SYSLOG",
        # QNX has no libpthread and no libdl: both are in libc. Sockets and
        # getaddrinfo are in libsocket.
        ex_libs          => "-lsocket",
        bn_ops           => "BN_LLONG RC4_CHAR",
        thread_scheme    => "pthreads",
        dso_scheme       => "dlfcn",
        # Used only without no-asm; see above.
        asm_arch         => 'armv4',
        perlasm_scheme   => "linux32",
        shared_target    => "linux-shared",
    },
);
